<h1>CSS Position Property Example</h1>
<div class="static-box">Static Position (default)</div>
<div class="relative-box">Relative Position <div class="relative-child">am positioned relative to my parent.</div></div>
<div class="absolute-container"><div class="absolute-box">Abosolute Position</div></div>

<div class="sticky-container"><div class="sticky-box">Sticky Position (sticks to the top as you scroll)</div></div>
<p>Scroll down to see the sticky effect.</p>
<p style="height: 1500px;"></p>
